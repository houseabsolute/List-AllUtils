exclude = [
    ".build/**/*",
    "List-AllUtils-*/**/*",
    "blib/**/*",
    "t/00-*",
    "t/author-*",
    "t/release-*",
    "t/zzz-*",
    "xt/**/*",
]

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint_flags = "--check"
tidy_flags = "--in-place"
ok_exit_codes = 0
lint_failure_exit_codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.omegasort-stopwords]
type = "both"
include = ".stopwords"
cmd = ["omegasort", "--sort", "text", "--case-insensitive", "--unique"]
lint_flags = "--check"
tidy_flags = "--in-place"
ok_exit_codes = 0
lint_failure_exit_codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.perlcritic]
type = "lint"
include = ["**/*.{pl,pm,t,psgi}"]
cmd = ["perlcritic", "--profile=$PRECIOUS_ROOT/perlcriticrc"]
ok_exit_codes = 0
lint_failure_exit_codes = 2

[commands.perltidy]
type = "both"
include = ["**/*.{pl,pm,t,psgi}"]
cmd = ["perltidy", "--profile=$PRECIOUS_ROOT/perltidyrc"]
lint_flags = ["--assert-tidy", "--no-standard-output", "--outfile=/dev/null"]
tidy_flags = ["--backup-and-modify-in-place", "--backup-file-extension=/"]
ok_exit_codes = 0
lint_failure_exit_codes = 2
ignore_stderr = "Begin Error Output Stream"

# We do not include podchecker or podtidy since our POD is just copied from
# other modules and it is best to leave it as-is.

[commands.oxfmt]
type = "both"
include = ["**/*.yml", "**/*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.typos]
type = "both"
include = "**/*"
exclude = [".stopwords"]
cmd = "typos"
tidy_flags = "--write-changes"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2
